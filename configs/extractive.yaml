# Offline / fast baseline — same as default except extractive generator.
# Usage: python scripts/run_pilot.py --config configs/extractive.yaml --limit 40

experiment:
  name: ca_rl_arag_m2_extractive
  seed: 42
  output_dir: results

data:
  processed_dir: data/processed
  index_dir: data/indexes
  train_file: data/processed/train_slice.jsonl
  eval_file: data/processed/eval_slice.jsonl
  corpus_file: data/processed/corpus.jsonl
  train_nq: 40
  train_hotpot: 60
  eval_nq: 25
  eval_hotpot: 25
  hotpot_config: distractor

retrieval:
  top_k: 5
  candidate_pool_size: 20
  rerank_top_n: 5
  method: bm25

agent:
  max_steps: 8
  max_retrieve: 3
  max_rewrite: 2
  max_rerank: 2
  max_verify: 2
  actions:
    - retrieve
    - rewrite
    - rerank
    - verify
    - stop

generation:
  backend: extractive
  model_name: null
  max_answer_tokens: 64
  temperature: 0.0

verification:
  backend: lexical_nli
  neural_model: cross-encoder/nli-deberta-v3-base
  support_threshold: 0.45
  contradiction_threshold: 0.55

budget:
  max_usd: 0.05
  max_tokens: 8000
  max_latency_ms: 30000
  force_stop_on_exhaustion: true

reward:
  preset: default
  quality_gate: 0.5

policy:
  name: rule_based

logging:
  save_trajectories: true
  trajectory_dir: results/trajectories
  metrics_dir: results/metrics
  figs_dir: results/figs
