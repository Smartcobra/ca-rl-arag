# FinOps price card (relative unit costs for V1).
# Absolute $ can be remapped later; ratios matter for policy learning.
# Aligns with Scope Memo V2 §6.2 and production transferability note.

currency: USD

llm:
  # Proxy FinOps rates (per 1M tokens). Local Qwen uses real token counts from the
  # tokenizer but these $ rates remain a transferable instrumentation scale.
  input_per_1m: 0.15
  output_per_1m: 0.60
  # Extractive backend still accrues "virtual" tokens for fair comparison.
  extractive_prompt_tokens_per_call: 200
  extractive_completion_tokens_per_call: 32

retrieval:
  bm25_per_call: 0.00005
  embed_per_query: 0.00002
  # Dense retrieve (unused in V1 BM25-only, reserved for V1.1)
  dense_per_call: 0.0001

rerank:
  cross_encoder_per_doc: 0.00001

verify:
  # NLI lexical is cheap; neural NLI priced closer to a small forward pass.
  lexical_nli_per_call: 0.00001
  neural_nli_per_call: 0.00008
  llm_verifier_per_1k_tokens: 0.0006  # reserved; not used in V1

latency:
  # Soft cost: μ * (latency_ms / 1000) * latency_unit_usd
  # The reward and the latency budget use the nominal table below.
  # Logged total_latency_ms stays the measured wall clock.
  latency_unit_usd_per_sec: 0.001
  # Per-call milliseconds from a non-negative least-squares fit to
  # total_latency_ms on the 2,100 v4 exam trajectories.
  # Generate is that fit's 957.89 ms at 2 completion tokens:
  # 853.9484 + 2 * 51.9733. The 51.9733 ms/token slope is the one-shot
  # median latency increase from a 1-word answer (1070.80 ms, n=135)
  # to a 2-word answer (1122.78 ms, n=110).
  # Verify's own increment is not separable from the draft generate in
  # those files, so the verifier call itself is 0. The draft is priced
  # as a generate.
  nominal_ms_per_call:
    retrieve: 212.3982
    rewrite: 999.2325
    rerank: 143.1998
    verify: 0.0
    generate: 853.9484
  nominal_ms_per_completion_token:
    generate: 51.9733

actions:
  # Fallback flat prices if detailed metering unavailable
  retrieve: 0.00007
  rewrite: 0.00025
  rerank: 0.00005
  verify: 0.00008
  stop: 0.00020
